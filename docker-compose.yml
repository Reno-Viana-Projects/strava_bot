services:
  strava_bot:
    restart: always
    env_file:
      - ../.env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app/strava_bot
    image: strava-bot
    working_dir: /app
    command: python3 -u bot.py
    networks:
      - webnet

networks:
  webnet:
    external: true
