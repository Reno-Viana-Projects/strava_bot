name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # deploy travado falha sozinho (07/10/2026 um build ficou 1h43 parado); o script também limita cada passo
    timeout-minutes: 40
    steps:
      - name: Deploy via SSH
        uses: nekiro/ssh-job@main
        with:
          host: ${{ secrets.HOST }}
          key: ${{ secrets.KEY }}
          user: ${{ secrets.USER }}
          command: |
            set -e
            cd assistant_project/strava_bot
            git pull
            docker network inspect webnet >/dev/null 2>&1 || docker network create webnet
            # Espaço, build e só depois `up -d`, sem `down` (build que falha deixa os containers no ar), pelo script único
            # do assistant_bot (scripts/deploy_compose.sh, plano 2026-10-07): sem espaço, faz a limpeza profunda antes de
            # desistir (cache de build, containers parados e imagens sem uso; nunca a base nem volumes).
            git -C ../assistant_bot pull -q || true
            bash ../assistant_bot/scripts/deploy_compose.sh .
